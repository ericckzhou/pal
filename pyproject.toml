[project]
name = "pal"
version = "0.1.0"
description = "Private, local-first personal assistant"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "httpx>=0.28",
    "keyring>=25",
    "argon2-cffi>=23",
    "pypdf>=5",
    "webauthn>=3.0",
    "cryptography>=44",
    "docling>=2.15",  # local PDF layout/table/OCR reading; models via `pal pdf-models`
    # Docling's PyTorch, listed so Linux can take the CPU-only build (see [tool.uv.sources]).
    "torch>=2.4 ; sys_platform == 'linux'",
    "torchvision>=0.19 ; sys_platform == 'linux'",
]

[project.scripts]
pal = "pal.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "cbor2>=5", "ruff>=0.15,<0.16", "mypy>=1.18"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# E501: long SQL and messages read better unwrapped. B008: FastAPI's Depends() in defaults is the intended pattern.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.13"
files = ["src/pal"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["pal"]

# Docling needs PyTorch. On Linux (Docker, CI) use the CPU-only wheels: the default ones bundle CUDA (~15 GB).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
