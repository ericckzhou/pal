[project]
name = "pal"
version = "0.1.0"
description = "Private, local-first personal assistant"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "httpx>=0.28",
    "keyring>=25",
    "argon2-cffi>=23",
    "pypdf>=5",
    "webauthn>=3.0",
    "cryptography>=44",
]

[project.scripts]
pal = "pal.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "cbor2>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
