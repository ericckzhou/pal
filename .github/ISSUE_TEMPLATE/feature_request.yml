name: Feature request
description: Suggest an idea or improvement for pal
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      description: pal keeps your data on your machine. See [CONTRIBUTING.md](https://github.com/ericckzhou/pal/blob/main/CONTRIBUTING.md#ground-rules).
      options:
        - label: This idea doesn't need pal to send data to an outside service, or if it does, I've explained why it should be an opt-in exception.
          required: true
